<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Golf Competition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;600;700;800&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="hdr-row">
    <div class="hdr-title">
      <div class="gamename" id="hdrGame">— ゲーム未選択 —</div>
      <h1>Golf <span>Competition</span></h1>
    </div>
    <div class="row" style="gap:6px;flex-wrap:nowrap">
      <select id="themeSel" onchange="setTheme(this.value)" data-i18n-title="theme.label" class="hdrsel">
        <option value="light" data-i18n="theme.light">ライト</option>
        <option value="dark" data-i18n="theme.dark">ダーク</option>
      </select>
      <select id="langSel" onchange="setLang(this.value)" aria-label="Language" class="hdrsel">
        <option value="ja">日本語</option>
        <option value="zh">中文</option>
        <option value="en">EN</option>
      </select>
      <button class="hamb" id="hambBtn" onclick="toggleMenu()">☰ メニュー</button>
    </div>
  </div>
</header>
<div id="menuOverlay" class="menu-overlay" onclick="toggleMenu(false)"></div>
<nav id="appMenu" class="appmenu">
  <button data-tab="game" onclick="go('game')" data-i18n="nav.game">ゲーム</button>
  <button data-tab="players" onclick="go('players')" data-i18n="nav.players">選手</button>
</nav>
<nav id="mainNav" class="mainnav">
  <button data-tab="home" onclick="go('home')" data-i18n="nav.home">ホーム</button>
  <button data-tab="score" onclick="go('score')" data-i18n="nav.score">スコア入力</button>
  <button data-tab="result" onclick="go('result')" data-i18n="nav.result">結果</button>
  <button id="chBadge" class="chbadge" onclick="toggleChannel()" data-i18n-title="ch.switch">α版</button>
</nav>
<main>
  <div id="view-home"></div>
  <div id="view-game" style="display:none"></div>
  <div id="view-players" style="display:none"></div>
  <div id="view-score" style="display:none"></div>
  <div id="view-result" style="display:none"></div>
</main>

<div class="toast" id="toast"></div>

<script src="js/state.js"></script>
<script src="js/i18n.js"></script>
<script src="js/nav.js"></script>
<script src="js/home.js"></script>
<script src="js/players.js"></script>
<script src="js/game.js"></script>
<script src="js/score.js"></script>
<script src="js/testdata.js"></script>
<script src="js/calc.js"></script>
<script src="js/results.js"></script>
<script src="js/roulette.js"></script>
<script src="js/backup.js"></script>
<script src="js/init.js"></script>
</body>
</html>
