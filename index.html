<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Golf Competition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;600;700;800&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="hdr-row">
    <div class="hdr-title">
      <div class="gamename" id="hdrGame">— ゲーム未選択 —</div>
    </div>
    <h1>Powered by 上海銀杏会・76会</h1>
    <button id="chBadge" class="chbadge" onclick="toggleChannel()" data-i18n-title="ch.switch">α版</button>
    <div class="row" style="gap:6px;flex-wrap:nowrap;margin-left:auto">
      <select id="themeSel" onchange="setTheme(this.value)" data-i18n-title="theme.label" class="hdrsel">
        <option value="light" data-i18n="theme.light">ライト</option>
        <option value="dark" data-i18n="theme.dark">ダーク</option>
      </select>
      <select id="langSel" onchange="setLang(this.value)" aria-label="Language" class="hdrsel">
        <option value="ja">日本語</option>
        <option value="zh">中文</option>
        <option value="en">EN</option>
      </select>
    </div>
  </div>
</header>
<nav id="mainNav" class="mainnav">
  <button id="menuBtn" class="menubtn" onclick="drawerToggle()" data-i18n-title="home.menu">☰</button>
  <button data-tab="home" onclick="go('home')" data-i18n="nav.home">ホーム</button>
  <button data-tab="result" onclick="go('result')" data-i18n="nav.result">結果発表</button>
  <button id="navCur" style="display:none" onclick="drawerToggle()"></button>
</nav>
<div id="drawerOverlay" class="drawer-overlay" onclick="drawerToggle(false)"></div>
<nav id="appDrawer" class="drawer">
  <div class="drawer-h" data-i18n="home.menu">メニュー</div>
  <button data-tab="game" onclick="go('game')"><span class="hl-t" data-i18n="nav.game">ゲーム</span><span class="hl-d" data-i18n="home.d.game">コンペ作成・ゲーム選択・ポイント設定</span></button>
  <button data-tab="course" onclick="go('course')"><span class="hl-t" data-i18n="nav.course">コース</span><span class="hl-d" data-i18n="home.d.course">パー・隠しホール・ニアピン/ドラコン対象ホール</span></button>
  <button data-tab="players" onclick="go('players')"><span class="hl-t" data-i18n="nav.players">選手</span><span class="hl-d" data-i18n="home.d.players">選手の登録・参加者とチームの設定</span></button>
  <button data-tab="score" onclick="go('score')"><span class="hl-t" data-i18n="nav.score">スコア</span><span class="hl-d" data-i18n="home.d.score">ラウンド中の打数入力</span></button>
</nav>
<main>
  <div id="view-home"></div>
  <div id="view-game" style="display:none"></div>
  <div id="view-course" style="display:none"></div>
  <div id="view-players" style="display:none"></div>
  <div id="view-score" style="display:none"></div>
  <div id="view-result" style="display:none"></div>
</main>

<div class="toast" id="toast"></div>

<script src="js/state.js"></script>
<script src="js/i18n.js"></script>
<script src="js/nav.js"></script>
<script src="js/home.js"></script>
<script src="js/players.js"></script>
<script src="js/game.js"></script>
<script src="js/course.js"></script>
<script src="js/score.js"></script>
<script src="js/testdata.js"></script>
<script src="js/calc.js"></script>
<script src="js/results.js"></script>
<script src="js/roulette.js"></script>
<script src="js/backup.js"></script>
<script src="js/init.js"></script>
</body>
</html>
