<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Golf Competition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;800&family=Noto+Sans+SC:wght@400;600;700;800&family=Noto+Serif+JP:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=184">
</head>
<body>
<header>
  <div class="hdr-row">
    <div class="hdr-title">
      <div class="gamename" id="hdrGame">— ゲーム未選択 —</div>
    </div>
    <h1>Powered by 上海銀杏会・76会・恩梯梯集団</h1>
    <button id="chBadge" class="chbadge" onclick="toggleChannel()" data-i18n-title="ch.switch">α版</button>
    <div class="row" style="gap:6px;flex-wrap:nowrap;margin-left:auto">
      <!-- テーマ切替（#166②）: 2値なのでアイコン1個のトグル。中身の SVG は syncThemeBtn()（js/nav.js）が差し替える -->
      <button id="themeSel" class="hdricon" onclick="toggleTheme()" data-i18n-title="theme.label" aria-pressed="false" title="テーマ" aria-label="テーマ"><svg class="ei" viewBox="0 0 24 24"><path d="M20.8 13.4A8.5 8.5 0 1110.6 3.2a6.6 6.6 0 0010.2 10.2z"/></svg></button>
      <select id="langSel" onchange="setLang(this.value)" aria-label="Language" class="hdrsel">
        <option value="ja">日本語</option>
        <option value="zh">中文</option>
        <option value="en">EN</option>
      </select>
    </div>
  </div>
</header>
<div class="navwrap">
  <nav id="mainNav" class="mainnav">
    <button data-tab="home" onclick="goHome()" data-i18n="nav.home">ホーム</button>
    <button data-tab="result" onclick="go('result')" data-i18n="nav.result">結果発表</button>
  </nav>
  <nav id="homeSub" class="subnav">
    <button data-tab="home"    onclick="go('home')"    data-i18n="nav.top">ガイド</button>
    <button data-tab="basic"   onclick="go('basic')"   data-i18n="nav.basic">コンペ設定</button>
    <button data-tab="course"  onclick="go('course')"  data-i18n="nav.course">コースマスタ</button>
    <button data-tab="players" onclick="go('players')" data-i18n="nav.players">選手・チームマスタ</button>
    <button data-tab="score"   onclick="go('score')"   data-i18n="nav.score">スコア</button>
  </nav>
</div>
<main>
  <div id="view-home"></div>
  <div id="view-basic" style="display:none"></div>
  <div id="view-course" style="display:none"></div>
  <div id="view-players" style="display:none"></div>
  <div id="view-score" style="display:none"></div>
  <div id="view-result" style="display:none"></div>
</main>

<div class="toast" id="toast"></div>

<script src="js/state.js?v=184"></script>
<script src="js/i18n.js?v=184"></script>
<script src="js/nav.js?v=184"></script>
<script src="js/home.js?v=184"></script>
<script src="js/basic.js?v=184"></script>
<script src="js/players.js?v=184"></script>
<script src="js/game.js?v=184"></script>
<script src="js/course.js?v=184"></script>
<script src="js/score.js?v=184"></script>
<script src="js/testdata.js?v=184"></script>
<script src="js/calc.js?v=184"></script>
<script src="js/results.js?v=184"></script>
<script src="js/results-team.js?v=184"></script>
<script src="js/results-m1.js?v=184"></script>
<script src="js/roulette.js?v=184"></script>
<script src="js/backup.js?v=184"></script>
<script src="js/init.js?v=184"></script>
</body>
</html>
