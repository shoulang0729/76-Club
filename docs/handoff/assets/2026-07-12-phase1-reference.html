<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>76-Club コンペ集計 🏌️</title>
<style>
  :root{
    --green:#186a3b; --green2:#239b56; --lime:#d5f5e3; --bg:#f4f6f7;
    --ink:#1b2631; --sub:#5d6d7e; --line:#d5dbdb; --gold:#d4ac0d; --red:#c0392b;
    --card:#fff; --blue:#2471a3; --purple:#7d3c98;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;padding-bottom:70px}
  header{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;padding:12px 14px;
    position:sticky;top:0;z-index:20;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  header h1{margin:0;font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
  header .gamename{font-size:12px;opacity:.9;margin-top:2px}
  main{padding:12px;max-width:900px;margin:0 auto}
  .tabbar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);
    display:flex;z-index:20;box-shadow:0 -2px 8px rgba(0,0,0,.08)}
  .tabbar button{flex:1;border:0;background:none;padding:8px 2px 6px;font-size:11px;color:var(--sub);
    display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
  .tabbar button .ic{font-size:20px;line-height:1}
  .tabbar button.active{color:var(--green);font-weight:700}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  .card h2{margin:0 0 10px;font-size:15px;color:var(--green);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .card h3{margin:14px 0 6px;font-size:13px;color:var(--sub)}
  label.fl{display:block;font-size:12px;color:var(--sub);margin:8px 0 3px;font-weight:600}
  input,select,textarea{font-family:inherit;font-size:15px;border:1px solid var(--line);border-radius:8px;
    padding:8px 10px;width:100%;background:#fff;color:var(--ink)}
  input[type=checkbox]{width:auto}
  button.btn{background:var(--green);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-size:14px;
    font-weight:700;cursor:pointer}
  button.btn.sec{background:#fff;color:var(--green);border:1.5px solid var(--green)}
  button.btn.gray{background:#eaeded;color:var(--ink)}
  button.btn.danger{background:var(--red)}
  button.btn.gold{background:var(--gold)}
  button.btn.sm{padding:5px 9px;font-size:12px;border-radius:6px}
  button.btn.wide{width:100%;padding:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .row.between{justify-content:space-between}
  .pill{display:inline-block;background:var(--lime);color:var(--green);border-radius:99px;padding:2px 9px;
    font-size:11px;font-weight:700}
  .pill.f{background:#fdebd0;color:#b9770e}
  .pill.e1{background:#d6eaf8;color:#2471a3}
  .pill.e2{background:#e8daef;color:#7d3c98}
  .muted{color:var(--sub);font-size:12px}
  .tag{font-size:10px;padding:1px 5px;border-radius:4px;background:#eaeded;color:var(--sub);margin-left:4px}
  table{border-collapse:collapse;width:100%;font-size:13px}
  th,td{border:1px solid var(--line);padding:5px 6px;text-align:center}
  th{background:#eafaf1;color:var(--green);font-weight:700;font-size:12px}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .scoregrid td input{width:38px;padding:5px 2px;text-align:center;border-radius:4px;font-size:14px}
  .scoregrid th, .scoregrid td{padding:3px 3px;min-width:34px}
  .scoregrid td.name{position:sticky;left:0;background:#fff;text-align:left;min-width:96px;font-weight:600;z-index:2}
  .scoregrid th.name{position:sticky;left:0;background:#eafaf1;z-index:3;text-align:left;min-width:96px}
  .scoregrid .sum{background:#f8f9f9;font-weight:700}
  .hidden-h{background:#fef9e7 !important}
  .rank1{color:var(--gold);font-weight:800}
  .rank td{font-weight:600}
  .lb th:first-child,.lb td:first-child{width:34px}
  .empty{text-align:center;color:var(--sub);padding:30px 10px}
  .chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:99px;
    padding:3px 8px;font-size:12px;margin:3px 4px 0 0;background:#fff;cursor:pointer}
  .chip.on{background:var(--green);color:#fff;border-color:var(--green)}
  .holebtn{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:#fff;margin:2px;
    font-size:13px;cursor:pointer;font-weight:600}
  .holebtn.np{background:var(--blue);color:#fff;border-color:var(--blue)}
  .holebtn.dc{background:var(--red);color:#fff;border-color:var(--red)}
  .seg{display:flex;border:1px solid var(--green);border-radius:8px;overflow:hidden;margin:4px 0}
  .seg button{flex:1;border:0;background:#fff;color:var(--green);padding:7px;font-size:13px;font-weight:700;cursor:pointer}
  .seg button.on{background:var(--green);color:#fff}
  .fmtgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .fmtgrid label{display:flex;align-items:center;gap:6px;font-size:13px;background:#f8f9f9;padding:8px;border-radius:8px;cursor:pointer}
  details{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:#fff}
  details>summary{padding:11px 12px;font-weight:700;cursor:pointer;color:var(--green);font-size:14px;list-style:none}
  details>summary::-webkit-details-marker{display:none}
  details>summary::before{content:"▸ ";}
  details[open]>summary::before{content:"▾ ";}
  details .in{padding:0 12px 12px;font-size:13px;color:var(--ink)}
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:9px 16px;border-radius:99px;font-size:13px;z-index:50;opacity:0;transition:.3s;pointer-events:none}
  .toast.show{opacity:.95}
  .prizewin{background:linear-gradient(135deg,#fef9e7,#fcf3cf);border:1px solid var(--gold)}
  .kanjicard{background:linear-gradient(135deg,#eaf2f8,#d6eaf8);border:1px solid var(--blue)}
  .payoutcard{background:linear-gradient(135deg,#eafaf1,#d5f5e3);border:1px solid var(--green2)}
  hr{border:0;border-top:1px solid var(--line);margin:12px 0}
  .medal{font-size:15px}
  .masked{color:var(--sub);font-style:italic;letter-spacing:2px}
  .reveal-controls{display:flex;gap:8px;margin:8px 0 4px;flex-wrap:wrap}
  .infobtn{border:1px solid var(--blue);color:var(--blue);background:#fff;border-radius:99px;
    width:20px;height:20px;font-size:12px;font-weight:700;cursor:pointer;padding:0;line-height:1}
  .rule{background:#f4f8fb;border:1px dashed var(--blue);border-radius:8px;padding:8px 10px;font-size:12px;color:#1b4a6b;margin:6px 0}
  .ptsedit input{width:74px;text-align:center;display:inline-block;padding:5px}
  .ptsrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:5px 0}
  .ptsrow span{font-size:13px}
  .big{font-size:20px;font-weight:800}
  .subtab{display:flex;gap:8px;margin-bottom:12px}
  .subtab button{flex:1;border:1.5px solid var(--green);background:#fff;color:var(--green);padding:11px;
    border-radius:10px;font-size:15px;font-weight:700;cursor:pointer}
  .subtab button.on{background:var(--green);color:#fff}
  .lb th,.lb td{white-space:nowrap}
  .scoregrid td.name,.scoregrid th.name{white-space:nowrap}
  .result-sticky{position:sticky;top:50px;z-index:15;background:var(--bg);padding:8px 0 6px;margin:-4px 0 8px;
    box-shadow:0 8px 8px -8px rgba(0,0,0,.18)}
  .subtab4{display:flex;gap:5px}
  .subtab4 button{flex:1;border:1.5px solid var(--green);background:#fff;color:var(--green);padding:8px 2px;
    border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;line-height:1.25}
  .subtab4 button.on{background:var(--green);color:#fff}
  .reveal-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;background:#fff;
    border:1px solid var(--line);border-radius:9px;padding:7px 9px}
  .reveal-bar .hole{font-weight:800;color:var(--gold);font-size:15px}
  .oh-open{background:#eafaf1 !important}
  .oh-closed{color:#c8cfcf}
  .ind-split{display:flex;gap:12px;align-items:flex-start}
  .ind-left{flex:1 1 46%;min-width:0}
  .ind-right{flex:1 1 46%;min-width:0}
  @media(max-width:760px){ .ind-split{flex-direction:column} .ind-left,.ind-right{flex:1 1 auto;width:100%} }
  .hlrow td{background:#eaf2f8 !important}
  .kanjibadge{background:#2471a3;color:#fff;border-radius:4px;font-size:10px;padding:1px 5px;margin-left:5px;font-weight:700}
  .card.tight{padding:11px}
  .card.tight h2{font-size:14px;margin-bottom:7px}
</style>
</head>
<body>
<header>
  <h1>⛳ 76-Club <span style="font-weight:400;opacity:.85">コンペ集計</span></h1>
  <div class="gamename" id="hdrGame">— ゲーム未選択 —</div>
</header>
<main>
  <div id="view-game"></div>
  <div id="view-players" style="display:none"></div>
  <div id="view-score" style="display:none"></div>
  <div id="view-result" style="display:none"></div>
</main>

<div class="tabbar">
  <button data-tab="game" class="active"><span class="ic">🗓️</span>ゲーム</button>
  <button data-tab="players"><span class="ic">👥</span>選手</button>
  <button data-tab="score"><span class="ic">✍️</span>入力</button>
  <button data-tab="result"><span class="ic">🏆</span>結果</button>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================ STATE ============================ */
const LS_KEY = "golfCompe_v1";
let state = load();
function load(){
  let s=null;
  try{ s = JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){}
  if(!s||!s.players) s = { players:[], games:[], currentGameId:null };
  migrate(s);
  return s;
}
function migrate(s){
  (s.players||[]).forEach(p=>{
    if(p.everyType===undefined) p.everyType='none';   // none | every1 | every2
    if(p.kanjiExempt===undefined) p.kanjiExempt=false;
    if(p.gender===undefined) p.gender='M';
    if(p.niapin2nd===undefined) p.niapin2nd=false;    // ニアピン2打目対象
    if(p.dracon2nd===undefined) p.dracon2nd=false;    // ドラコン2打目対象
  });
  (s.games||[]).forEach(g=>{
    if(!g.womenEvery) g.womenEvery={enabled:false};
    if(g.womenEvery.enabled===undefined) g.womenEvery.enabled=false;
    if(!g.points) g.points=defaultPoints();
    else { const d=defaultPoints(); for(const k in d) if(g.points[k]===undefined) g.points[k]=d[k]; }
    if(g.prizePool===undefined) g.prizePool=0;
    if(!g.prizes) g.prizes={ niapinHoles:[], draconHoles:[], niapinWinner:{}, draconWinner:{} };
  });
}
function defaultPoints(){ return {
  net:[5,3,1], gross:[5,3,1], stableford:[5,3,1], olympic:[5,3,1], callaway:[5,3,1], nassauTotal:[5,3,1],
  teamGross:[3], teamNet:[3], holeByHole:[3], best2ball:[3], niapin:2, dracon:2 }; }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1600); }
function curGame(){ return state.games.find(g=>g.id===state.currentGameId)||null; }

function newGame(){
  return {
    id:uid(), name:"新しいコンペ", date:new Date().toISOString().slice(0,10), course:"",
    par:[4,4,3,4,5,4,4,3,4, 4,4,3,4,5,4,4,3,4],
    hidden:Array(18).fill(false),
    periaCoef:0.8, periaCap:null,
    womenEvery:{enabled:false},
    teams:[],
    participants:[],
    scores:{},
    prizes:{ niapinHoles:[], draconHoles:[], niapinWinner:{}, draconWinner:{} },
    points:defaultPoints(), prizePool:0,
    formats:{ gross:true, net:true, teamGross:true, teamNet:true, holeByHole:true,
      stableford:true, nassau:true, olympic:true, callaway:false, best2ball:false }
  };
}

/* ============================ TAB NAV ============================ */
const views = { game:'view-game', players:'view-players', score:'view-score', result:'view-result' };
let activeTab='game';
let revealHoles=18;            // 個人戦で開封済みのホール数(0-18)。18=全開（既定）
document.querySelectorAll('.tabbar button').forEach(b=>{
  b.onclick=()=>{ activeTab=b.dataset.tab;
    document.querySelectorAll('.tabbar button').forEach(x=>x.classList.toggle('active',x===b));
    render(); };
});
function render(){
  Object.entries(views).forEach(([k,id])=> document.getElementById(id).style.display = k===activeTab?'':'none');
  const g=curGame();
  document.getElementById('hdrGame').textContent = g? `${g.name}　${g.date}${g.course?'　@'+g.course:''}` : '— ゲーム未選択 —';
  if(activeTab==='game') renderGame();
  if(activeTab==='players') renderPlayers();
  if(activeTab==='score') renderScore();
  if(activeTab==='result') renderResult();
}
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const EVERY_LABEL={none:'なし', every1:'E1(−18)', every2:'E2(−36)'};

/* ============================ PLAYERS ============================ */
function renderPlayers(){
  const el=document.getElementById('view-players');
  el.innerHTML = `
    <div class="card">
      <h2>👥 選手マスター</h2>
      <div class="row">
        <input id="pName" placeholder="名前" style="flex:2;min-width:120px">
        <select id="pGender" style="flex:1"><option value="M">男性</option><option value="F">女性</option></select>
      </div>
      <div class="row" style="margin-top:6px">
        <div style="flex:2;min-width:120px"><label class="fl">エブリハンデ区分</label>
          <select id="pEvery"><option value="none">なし（男性と同扱い）</option><option value="every1">エブリワン（−18）</option><option value="every2">エブリツー（−36）</option></select></div>
        <label style="flex:1;display:flex;align-items:center;gap:6px;font-size:13px;margin-top:18px"><input type="checkbox" id="pKanji"> 幹事対象外</label>
      </div>
      <div class="row" style="margin-top:8px">
        <label style="flex:1;display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="pNp2"> 📍ニアピン2打目対象</label>
        <label style="flex:1;display:flex;align-items:center;gap:6px;font-size:13px"><input type="checkbox" id="pDc2"> 💪ドラコン2打目対象</label>
      </div>
      <button class="btn wide" style="margin-top:10px" onclick="addPlayer()">＋ 選手を追加</button>
      <div class="muted" style="margin-top:6px">2打目対象＝ニアピン/ドラコンを2打目で計測してよい人（女性など）。ハンデはエブリ区分で判定（女性でも「なし」可）。幹事対象外＝次回幹事に選ばれない人。</div>
    </div>
    <div class="card">
      <h2>登録済み（${state.players.length}名）</h2>
      ${state.players.length? `<div class="scroll"><table><tr><th>名前</th><th>性別</th><th>ハンデ<br>区分</th><th>幹事<br>対象外</th><th>ニア<br>2打</th><th>ドラ<br>2打</th><th></th></tr>
        ${state.players.map(p=>`<tr>
          <td style="text-align:left;white-space:nowrap">${esc(p.name)}</td>
          <td>${p.gender==='F'?'<span class="pill f">女</span>':'<span class="pill">男</span>'}</td>
          <td><select style="padding:4px;font-size:12px" onchange="setPlayerEvery('${p.id}',this.value)">
            <option value="none" ${p.everyType==='none'?'selected':''}>なし</option>
            <option value="every1" ${p.everyType==='every1'?'selected':''}>E1(−18)</option>
            <option value="every2" ${p.everyType==='every2'?'selected':''}>E2(−36)</option></select></td>
          <td><input type="checkbox" ${p.kanjiExempt?'checked':''} onchange="setPlayerKanji('${p.id}',this.checked)"></td>
          <td><input type="checkbox" ${p.niapin2nd?'checked':''} onchange="setPlayer2nd('${p.id}','niapin2nd',this.checked)"></td>
          <td><input type="checkbox" ${p.dracon2nd?'checked':''} onchange="setPlayer2nd('${p.id}','dracon2nd',this.checked)"></td>
          <td><button class="btn sm gray" onclick="editPlayer('${p.id}')">✎</button>
              <button class="btn sm danger" onclick="delPlayer('${p.id}')">×</button></td>
        </tr>`).join('')}</table></div>` : `<div class="empty">まだ選手がいません</div>`}
    </div>
    <div class="card">
      <h2>💾 バックアップ</h2>
      <div class="muted">端末保存なのでたまに書き出しを。機種変・データ消失に備えられます。</div>
      <div class="row" style="margin-top:8px">
        <button class="btn sec" onclick="exportData()">JSON書き出し</button>
        <label class="btn sec" style="cursor:pointer">JSON読み込み<input type="file" accept="application/json" style="display:none" onchange="importData(this)"></label>
      </div>
    </div>`;
}
function addPlayer(){
  const n=document.getElementById('pName').value.trim(); if(!n) return toast('名前を入力');
  state.players.push({id:uid(),name:n,gender:document.getElementById('pGender').value,
    everyType:document.getElementById('pEvery').value, kanjiExempt:document.getElementById('pKanji').checked,
    niapin2nd:document.getElementById('pNp2').checked, dracon2nd:document.getElementById('pDc2').checked});
  save(); renderPlayers(); toast('追加しました');
}
function editPlayer(id){ const p=state.players.find(x=>x.id===id);
  const n=prompt('名前',p.name); if(n===null)return; p.name=n.trim()||p.name;
  const g=confirm('性別は「女性」ですか？（OK=女性 / キャンセル=男性）'); p.gender=g?'F':'M';
  save(); renderPlayers(); }
function setPlayerEvery(id,v){ state.players.find(p=>p.id===id).everyType=v; save(); }
function setPlayerKanji(id,v){ state.players.find(p=>p.id===id).kanjiExempt=v; save(); }
function setPlayer2nd(id,which,v){ state.players.find(p=>p.id===id)[which]=v; save(); }
function delPlayer(id){ if(!confirm('削除しますか？'))return;
  state.players=state.players.filter(p=>p.id!==id);
  state.games.forEach(g=>{ g.participants=g.participants.filter(x=>x!==id); delete g.scores[id];
    g.teams.forEach(t=>t.memberIds=t.memberIds.filter(x=>x!==id)); });
  save(); renderPlayers(); }

/* ============================ GAME SETUP ============================ */
function renderGame(){
  const el=document.getElementById('view-game');
  let html = `<div class="card"><h2>🗓️ ゲーム（コンペ）</h2>
    <div class="row between">
      <select id="gameSel" onchange="selectGame(this.value)" style="flex:1">
        <option value="">— 選択 —</option>
        ${state.games.map(g=>`<option value="${g.id}" ${g.id===state.currentGameId?'selected':''}>${esc(g.name)} (${g.date})</option>`).join('')}
      </select>
      <button class="btn" onclick="createGame()">＋新規</button>
    </div></div>`;

  const g=curGame();
  if(!g){ el.innerHTML=html+`<div class="empty">ゲームを新規作成してください（動作確認は最下部の「🔧 幹事メニュー」から）</div>`+hostMenuCard(); return; }

  html += `<div class="card"><h2>基本設定</h2>
    <label class="fl">コンペ名</label><input value="${esc(g.name)}" onchange="setG('name',this.value)">
    <div class="row"><div style="flex:1"><label class="fl">日付</label><input type="date" value="${g.date}" onchange="setG('date',this.value)"></div>
    <div style="flex:1"><label class="fl">コース</label><input value="${esc(g.course)}" placeholder="○○CC" onchange="setG('course',this.value)"></div></div>
    <div class="row" style="margin-top:10px">
      <button class="btn danger sm" onclick="deleteGame()">このゲームを削除</button>
      <button class="btn gray sm" onclick="dupGame()">複製</button>
    </div>
  </div>`;

  html += `<div class="card"><h2>⛳ コース設定（パー / 隠しホール）</h2>
    <div class="muted">黄色い枠がダブルペリアの隠しホール。<b>12ホール</b>選んでください（現在 <b id="hidCount">${g.hidden.filter(Boolean).length}</b>）。</div>
    <div class="row" style="margin:8px 0"><button class="btn sec sm" onclick="randomHidden()">🎲 隠し12ランダム</button>
      <button class="btn gray sm" onclick="clearHidden()">クリア</button></div>
    <div class="scroll"><table class="scoregrid"><tr><th class="name">H</th>${g.par.map((_,i)=>`<th>${i+1}</th>`).join('')}<th class="sum">計</th></tr>
      <tr><td class="name">Par</td>${g.par.map((p,i)=>`<td class="${g.hidden[i]?'hidden-h':''}"><input type="number" min="3" max="6" value="${p}" onchange="setPar(${i},this.value)"></td>`).join('')}<td class="sum">${g.par.reduce((a,b)=>a+b,0)}</td></tr>

  html += `<div class="card"><h2>📐 ダブルペリア設定</h2>

    <div class="row"><button class="btn sec sm" onclick="addTeam()">＋チーム追加</button>
      <button class="btn gray sm" onclick="autoTeams(2)">自動2組</button>

    ${g.teams.map(t=>`<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px">
      <div class="row between"><input value="${esc(t.name)}" onchange="setTeamName('${t.id}',this.value)" style="flex:1;font-weight:700">

      <div style="margin-top:6px">${g.participants.map(pid=>{const p=state.players.find(x=>x.id===pid);if(!p)return'';
        return `<span class="chip ${t.memberIds.includes(pid)?'on':''}" onclick="toggleTeamMember('${t.id}','${pid}')">${esc(p.name)}</span>`}).join('')}</div>
    </div>`).join('') || '<div class="muted">チーム未設定</div>'}

  html += `<div class="card"><h2>🎯 ニアピン / ドラコン ホール</h2>

    <div style="margin-top:6px">${g.par.map((_,i)=>{
      const np=g.prizes.niapinHoles.includes(i), dc=g.prizes.draconHoles.includes(i);
      return `<button class="holebtn ${np?'np':''} ${dc?'dc':''}" onclick="cyclePrize(${i})">${i+1}</button>`}).join('')}</div>
    <div class="muted" style="margin-top:6px">💡 女性はドラコン/ニアピンとも<b>2打目</b>を計測対象にできます（ローカルルールの注記）。</div></div>`;

  const F=g.formats;
  const fchk=(k,label)=>`<label><input type="checkbox" ${F[k]?'checked':''} onchange="setFmt('${k}',this.checked)"> ${label}</label>`;
  html += `<div class="card"><h2>🎮 集計する競技</h2><div class="fmtgrid">
    ${fchk('gross','グロス個人戦')}${fchk('net','ネット個人戦')}

function setG(k,v){ const g=curGame(); g[k]=v; save(); if(k==='name'||k==='date'||k==='course')render(); }
function setCap(v){ const g=curGame(); g.periaCap = v===''?null:parseFloat(v); save(); }
function setWE(v){ curGame().womenEvery.enabled=v; save(); }
function setPar(i,v){ curGame().par[i]=parseInt(v)||0; save(); renderGame(); }
function toggleHidden(i){ const g=curGame(); g.hidden[i]=!g.hidden[i]; save(); document.getElementById('hidCount').textContent=g.hidden.filter(Boolean).length; }
function randomHidden(){ const g=curGame(); const idx=[...Array(18).keys()].sort(()=>Math.random()-0.5).slice(0,12);
  g.hidden=Array(18).fill(false); idx.forEach(i=>g.hidden[i]=true); save(); renderGame(); }
function clearHidden(){ curGame().hidden=Array(18).fill(false); save(); renderGame(); }
function setFmt(k,v){ curGame().formats[k]=v; save(); renderGame(); }
function setPoints(k,v){ curGame().points[k]=v.split(',').map(x=>parseInt(x.trim())).filter(x=>!isNaN(x)); save(); }
function setPointsNum(k,v){ curGame().points[k]=parseInt(v)||0; save(); }
function createGame(){ const g=newGame(); state.games.push(g); state.currentGameId=g.id; save(); render(); toast('新規ゲーム作成'); }
function selectGame(id){ state.currentGameId=id||null; save(); render(); }
function deleteGame(){ if(!confirm('このゲームを削除しますか？'))return;
  state.games=state.games.filter(x=>x.id!==state.currentGameId); state.currentGameId=state.games[0]?.id||null; save(); render(); }
function dupGame(){ const g=JSON.parse(JSON.stringify(curGame())); g.id=uid(); g.name=g.name+' (複製)'; state.games.push(g); state.currentGameId=g.id; save(); render(); }
function toggleParticipant(pid){ const g=curGame(); const i=g.participants.indexOf(pid);
  if(i<0){ g.participants.push(pid); g.scores[pid]=g.scores[pid]||Array(18).fill(null); }
  else { g.participants.splice(i,1); } save(); renderGame(); }
function addTeam(){ const g=curGame(); const names=['レッド','ブルー','グリーン','イエロー'];
  g.teams.push({id:uid(),name:'チーム'+names[g.teams.length%4],memberIds:[]}); save(); renderGame(); }
function autoTeams(n){ const g=curGame(); const names=['レッド','ブルー','グリーン'];
  g.teams=[]; for(let i=0;i<n;i++)g.teams.push({id:uid(),name:'チーム'+names[i],memberIds:[]});
  g.participants.forEach((pid,i)=>g.teams[i%n].memberIds.push(pid)); save(); renderGame(); }
function setTeamName(id,v){ curGame().teams.find(t=>t.id===id).name=v; save(); }
function delTeam(id){ const g=curGame(); g.teams=g.teams.filter(t=>t.id!==id); save(); renderGame(); }
function toggleTeamMember(tid,pid){ const g=curGame();
  g.teams.forEach(t=>{ if(t.id!==tid) t.memberIds=t.memberIds.filter(x=>x!==pid); });
  const t=g.teams.find(t=>t.id===tid); const i=t.memberIds.indexOf(pid);
  if(i<0)t.memberIds.push(pid); else t.memberIds.splice(i,1); save(); renderGame(); }
function cyclePrize(i){ const p=curGame().prizes;
  const np=p.niapinHoles.includes(i), dc=p.draconHoles.includes(i);
  p.niapinHoles=p.niapinHoles.filter(x=>x!==i); p.draconHoles=p.draconHoles.filter(x=>x!==i);
  if(!np&&!dc)p.niapinHoles.push(i); else if(np)p.draconHoles.push(i);
  save(); renderGame(); }

/* ============================ SCORE ENTRY ============================ */
function renderScore(){
  const el=document.getElementById('view-score'); const g=curGame();
  if(!g){ el.innerHTML='<div class="empty">先にゲームを作成してください</div>'; return; }
  if(!g.participants.length){ el.innerHTML='<div class="empty">「ゲーム」タブで参加者を選んでください</div>'; return; }
  let html=`<div class="card"><h2>✍️ スコア入力</h2>
    <div class="muted">各マスに打数を入力（入力しても画面は動きません＝続けて次のマスへ）。横スクロールで18Hまで。黄=隠しホール。空欄=未入力。写真から入れたい時はチャットに送ってください（転記します）。</div>
    <div class="row" style="margin-top:8px"><button class="btn sec sm" onclick="fillRandomScores()">🎲 テスト用にランダムで埋める</button>
      <button class="btn gray sm" onclick="clearScores()">スコアをクリア</button></div>
  </div>`;
  html+=`<div class="card"><div class="scroll"><table class="scoregrid">
    <tr><th class="name">選手</th>${g.par.map((_,i)=>`<th class="${g.hidden[i]?'hidden-h':''}">${i+1}</th>`).join('')}<th class="sum">OUT</th><th class="sum">IN</th><th class="sum">計</th></tr>
    <tr><td class="name" style="font-size:11px;color:var(--sub)">Par</td>${g.par.map((p,i)=>`<td class="${g.hidden[i]?'hidden-h':''}" style="font-size:11px;color:var(--sub)">${p}</td>`).join('')}<td class="sum">${sum(g.par,0,9)}</td><td class="sum">${sum(g.par,9,18)}</td><td class="sum">${sum(g.par,0,18)}</td></tr>
    ${g.participants.map(pid=>{ const p=state.players.find(x=>x.id===pid); if(!p)return'';
      const sc=g.scores[pid]||Array(18).fill(null);
      return `<tr><td class="name">${p.gender==='F'?'🌸':''}${esc(p.name)}</td>
        ${sc.map((v,i)=>`<td class="${g.hidden[i]?'hidden-h':''}"><input id="sc-${pid}-${i}" type="number" inputmode="numeric" pattern="[0-9]*" min="1" max="15" value="${v??''}" onchange="setScore('${pid}',${i},this)"></td>`).join('')}
        <td class="sum" id="out-${pid}">${sum(sc,0,9)||''}</td><td class="sum" id="in-${pid}">${sum(sc,9,18)||''}</td><td class="sum" id="tot-${pid}">${sum(sc,0,18)||''}</td></tr>`;
    }).join('')}
  </table></div></div>`;
  el.innerHTML=html;
}
function sum(a,s,e){ let t=0,any=false; for(let i=s;i<e;i++){ if(a[i]!=null&&a[i]!==''){t+=Number(a[i]);any=true;} } return any?t:0; }
// フォーカスを失わないよう、再描画せず合計セルだけ更新
function setScore(pid,i,el){ const g=curGame(); g.scores[pid]=g.scores[pid]||Array(18).fill(null);
  const v=el.value; g.scores[pid][i] = v===''?null:(parseInt(v)||null); save(); updateRowSums(g,pid); }
function updateRowSums(g,pid){ const sc=g.scores[pid]||[];
  const o=document.getElementById('out-'+pid), n=document.getElementById('in-'+pid), t=document.getElementById('tot-'+pid);
  if(o)o.textContent=sum(sc,0,9)||''; if(n)n.textContent=sum(sc,9,18)||''; if(t)t.textContent=sum(sc,0,18)||''; }
function fillRandomScores(){ const g=curGame(); if(!g)return;
  g.participants.forEach(pid=>{ g.scores[pid]=g.par.map(par=>{ const r=Math.random();
    const d = r<0.05?-1 : r<0.45?0 : r<0.75?1 : r<0.92?2 : 3;  // バーディ寄り〜大叩き
    return Math.max(2, par+d); }); });
  save(); renderScore(); toast('ランダムスコアを入れました'); }
function clearScores(){ const g=curGame(); if(!g)return; if(!confirm('全員のスコアをクリアしますか？'))return;
  g.participants.forEach(pid=>{ g.scores[pid]=Array(18).fill(null); }); save(); renderScore(); }

/* ---- 確定/暫定判定 ---- */
function allComplete(g){ const parts=g.participants.filter(pid=>state.players.find(x=>x.id===pid));
  return parts.length>0 && parts.every(pid=>complete(g,pid)); }
function statusBadge(g){ return allComplete(g)
  ? '<span class="tag" style="background:#186a3b;color:#fff">🏁 確定</span>'
  : '<span class="tag" style="background:#d4ac0d;color:#fff">⏳ 暫定</span>'; }

/* ============================ TEST DATA ============================ */
function seedTestData(){
  if(!confirm('テスト用のサンプル（12名・コース・スコア）を新しいゲームとして作成します。よろしいですか？'))return;
  const samples=[
    ['田中 太郎','M','none',false],['佐藤 花子','F','every2',false],['鈴木 一郎','M','none',false],
    ['高橋 美咲','F','every1',false],['渡辺 健','M','none',false],['伊藤 由美','F','none',false],
    ['山本 大輔','M','none',true],['中村 彩','F','every2',false],['小林 誠','M','none',false],
    ['加藤 香織','F','every1',false],['吉田 隆','M','none',false],['松本 恵','F','none',false]];
  const ids=samples.map(([name,gender,everyType,kanjiExempt])=>{
    const n2=gender==='F', d2=gender==='F';   // 女性はニアピン/ドラコン2打目対象（デモ）
    let p=state.players.find(x=>x.name===name);
    if(!p){ p={id:uid(),name,gender,everyType,kanjiExempt,niapin2nd:n2,dracon2nd:d2}; state.players.push(p); }
    else { p.gender=gender; p.everyType=everyType; p.kanjiExempt=kanjiExempt; p.niapin2nd=n2; p.dracon2nd=d2; }
    return p.id;
  });
  const g=newGame();
  g.name='🧪 テストコンペ'; g.course='テスト国際CC';
  g.par=[4,4,3,5,4,4,3,4,5, 4,4,3,4,5,4,4,3,5];  // 72
  // 隠し12ホールをランダム
  const idx=[...Array(18).keys()].sort(()=>Math.random()-0.5).slice(0,12);
  g.hidden=Array(18).fill(false); idx.forEach(i=>g.hidden[i]=true);
  g.womenEvery.enabled=true;
  g.prizePool=24000;
  g.participants=ids.slice();
  ids.forEach(pid=>{ g.scores[pid]=g.par.map(par=>{ const r=Math.random();
    const d=r<0.05?-1:r<0.45?0:r<0.75?1:r<0.92?2:3; return Math.max(2,par+d); }); });
  // 3チームに自動割当
  const tnames=['レッド','ブルー','グリーン'];
  g.teams=tnames.map(n=>({id:uid(),name:'チーム'+n,memberIds:[]}));
  ids.forEach((pid,i)=>g.teams[i%3].memberIds.push(pid));
  // ニアピン(par3)・ドラコン(par5)を対象に、勝者もランダム
  g.par.forEach((par,i)=>{ if(par===3)g.prizes.niapinHoles.push(i); if(par===5)g.prizes.draconHoles.push(i); });
  g.prizes.niapinHoles.forEach(h=>{ g.prizes.niapinWinner[h]=ids[Math.floor(Math.random()*ids.length)]; });
  g.prizes.draconHoles.forEach(h=>{ g.prizes.draconWinner[h]=ids[Math.floor(Math.random()*ids.length)]; });
  state.games.push(g); state.currentGameId=g.id; save(); render(); toast('テストデータを作成しました');
}

/* ============================ CALCULATIONS ============================ */
function parTotal(g){ return g.par.reduce((a,b)=>a+b,0); }
function gross(g,pid){ const sc=g.scores[pid]||[]; return sc.reduce((a,v)=>a+(v?Number(v):0),0); }
function complete(g,pid){ const sc=g.scores[pid]||[]; return sc.filter(v=>v!=null&&v!=='').length===18; }
function periaHdcp(g,pid){
  const sc=g.scores[pid]||[]; let h=0; g.hidden.forEach((hid,i)=>{ if(hid)h+=(sc[i]?Number(sc[i]):0); });
  let hd=(h*1.5 - parTotal(g))*g.periaCoef;
  if(hd<0)hd=0; if(g.periaCap!=null && hd>g.periaCap)hd=g.periaCap;
  return Math.round(hd*10)/10;
}
function womenEvery(g,pid){ const p=state.players.find(x=>x.id===pid);
  if(!g.womenEvery.enabled || !p) return 0;
  return p.everyType==='every1'?18 : p.everyType==='every2'?36 : 0;
}
function gross_(g,pid){ return gross(g,pid); }
function effGross(g,pid){ return gross(g,pid) - womenEvery(g,pid); }
function netScore(g,pid){ return Math.round((effGross(g,pid) - periaHdcp(g,pid))*10)/10; }
function stablefordPts(g,pid){ const sc=g.scores[pid]||[]; let t=0;
  sc.forEach((v,i)=>{ if(v==null||v==='')return; const d=Number(v)-g.par[i];
    t += d<=-3?5 : d===-2?4 : d===-1?3 : d===0?2 : d===1?1 : 0; }); return t; }
function olympicPts(g,pid){ const sc=g.scores[pid]||[]; let t=0;
  sc.forEach((v,i)=>{ if(v==null||v==='')return; const d=Number(v)-g.par[i];
    t += d<=-3?10 : d===-2?6 : d===-1?4 : d===0?1 : 0; }); return t; }
function callawayHdcp(g,pid){
  const sc=g.scores[pid]||[]; const gr=gross(g,pid); if(!complete(g,pid))return null;
  const tbl=[[71,0],[75,0.5],[80,1],[85,1.5],[90,2],[95,2.5],[100,3],[105,3.5],[110,4],[115,4.5],[120,5],[125,5.5],[130,6],[9999,6.5]];
  let units=0; for(const [max,u] of tbl){ if(gr<=max){units=u;break;} }
  const adj=[[71,-2],[75,-1],[80,0],[85,1],[90,2],[95,-2],[100,-1],[105,0],[110,1],[9999,2]];
  let a=0; for(const [max,x] of adj){ if(gr<=max){a=x;break;} }
  const holes=sc.slice(0,16).map(v=>v?Number(v):0).sort((x,y)=>y-x);
  const whole=Math.floor(units); let ded=0;
  for(let i=0;i<whole;i++)ded+=holes[i]||0;
  if(units-whole>=0.5)ded+=(holes[whole]||0)/2;
  let hd=ded+a; if(hd<0)hd=0; return Math.round(hd*10)/10;
}
function callawayNet(g,pid){ const h=callawayHdcp(g,pid); return h==null?null:gross(g,pid)-h; }
function net9(g,pid,s,e){ const raw=sum(g.scores[pid]||[],s,e); return Math.round((raw-womenEvery(g,pid)/2-periaHdcp(g,pid)/2)*10)/10; }
function nassauTotalNet(g,pid){ return Math.round((net9(g,pid,0,9)+net9(g,pid,9,18))*10)/10; }

/* ---- ranking helpers ---- */
function ranked(pids, valFn, dir){
  const rows=pids.map(pid=>({pid,v:valFn(pid)})).filter(r=>r.v!=null);
  rows.sort((a,b)=> dir==='asc'? a.v-b.v : b.v-a.v);
  let rank=0,prev=null;
  return rows.map((r,i)=>{ if(prev===null||r.v!==prev){rank=i+1;prev=r.v;} return {pid:r.pid,v:r.v,rank}; });
}
function teamRanked(g, valFn, dir){
  const teams=g.teams.filter(t=>t.memberIds.length);
  const rows=teams.map(t=>({t,v:valFn(t)})).filter(r=>r.v!=null);
  rows.sort((a,b)=> dir==='asc'? a.v-b.v : b.v-a.v);
  let rank=0,prev=null;
  return rows.map((r,i)=>{ if(prev===null||r.v!==prev){rank=i+1;prev=r.v;} return {t:r.t,v:r.v,rank}; });
}
function holesWon(g){
  const teams=g.teams.filter(t=>t.memberIds.length); const won=teams.map(()=>0);
  for(let h=0;h<18;h++){
    const tot=teams.map(t=>{ let s=0,cnt=0; t.memberIds.forEach(pid=>{const v=(g.scores[pid]||[])[h]; if(v){s+=Number(v);cnt++;}}); return cnt?s:null; });
    const valid=tot.filter(v=>v!=null); if(!valid.length)continue;
    const min=Math.min(...valid); const winners=tot.map((v,i)=>v===min?i:-1).filter(i=>i>=0);
    winners.forEach(i=>won[i]+=1/winners.length);
  }
  return {teams,won};
}
function best2(g,t){ const ns=t.memberIds.map(pid=>netScore(g,pid)).sort((a,b)=>a-b); return Math.round((ns[0]+(ns[1]||ns[0]))*10)/10; }

/* ---- points & payout ---- */
function computePoints(g){
  const parts=g.participants.filter(pid=>state.players.find(x=>x.id===pid));
  const pts={}; parts.forEach(pid=>pts[pid]=0);
  const F=g.formats, P=g.points;
  const entered=pid=>(g.scores[pid]||[]).some(v=>v!=null&&v!=='');   // 1H以上入力済み（表彰式では開封済みのみ）
  const iv=fn=>pid=> entered(pid)? fn(pid) : null;                    // 未入力＝ランキング対象外＝配点なし
  const awardInd=(cond,order,arr)=>{ if(!cond||!arr||!arr.length)return; order.forEach(o=>{ pts[o.pid]=(pts[o.pid]||0)+(arr[o.rank-1]||0); }); };
  awardInd(F.net, ranked(parts,iv(pid=>netScore(g,pid)),'asc'), P.net);
  awardInd(F.gross, ranked(parts,iv(pid=>effGross(g,pid)),'asc'), P.gross);
  awardInd(F.stableford, ranked(parts,iv(pid=>stablefordPts(g,pid)),'desc'), P.stableford);
  awardInd(F.olympic, ranked(parts,iv(pid=>olympicPts(g,pid)),'desc'), P.olympic);
  awardInd(F.callaway, ranked(parts,pid=>callawayNet(g,pid),'asc'), P.callaway);   // callawayNetは18H完了時のみ値
  awardInd(F.nassau, ranked(parts,iv(pid=>nassauTotalNet(g,pid)),'asc'), P.nassauTotal);
  // prizes
  Object.values(g.prizes.niapinWinner||{}).forEach(pid=>{ if(pid&&pts[pid]!=null)pts[pid]+=(P.niapin||0); });
  Object.values(g.prizes.draconWinner||{}).forEach(pid=>{ if(pid&&pts[pid]!=null)pts[pid]+=(P.dracon||0); });
  // teams（1人でも入力があるチームのみ配点）
  const teamEntered=t=>t.memberIds.some(pid=>entered(pid));
  const awardTeam=(cond,tr,arr)=>{ if(!cond||!arr||!arr.length)return; tr.forEach(r=>{ if(!teamEntered(r.t))return; const p=arr[r.rank-1]||0; r.t.memberIds.forEach(pid=>{ if(pts[pid]!=null)pts[pid]+=p; }); }); };
  if(g.teams.length){
    awardTeam(F.teamGross, teamRanked(g,t=>t.memberIds.reduce((a,pid)=>a+effGross(g,pid),0),'asc'), P.teamGross);
    awardTeam(F.teamNet, teamRanked(g,t=>Math.round(t.memberIds.reduce((a,pid)=>a+netScore(g,pid),0)*10)/10,'asc'), P.teamNet);
    awardTeam(F.best2ball, teamRanked(g,t=>best2(g,t),'asc'), P.best2ball);
    if(F.holeByHole){ const {teams,won}=holesWon(g); const anyHole=won.some(w=>w>0);
      if(anyHole){ const rows=teams.map((t,i)=>({t,v:won[i]})); rows.sort((a,b)=>b.v-a.v);
        let rank=0,prev=null; rows.forEach((r,i)=>{ if(prev===null||r.v!==prev){rank=i+1;prev=r.v;} const p=(P.holeByHole||[])[rank-1]||0; r.t.memberIds.forEach(pid=>{ if(pts[pid]!=null)pts[pid]+=p; }); }); }
    }
  }
  return pts;
}
function computePayout(g){
  const pts=computePoints(g); const parts=Object.keys(pts);
  const total=parts.reduce((a,pid)=>a+pts[pid],0);
  const pool=g.prizePool||0;
  const out={}; parts.forEach(pid=>{ out[pid]= (total>0&&pool>0)? Math.round(pool*pts[pid]/total) : 0; });
  return {pts,payout:out,total,pool};
}
/* next kanji: 2位 と ブービー(下から2番目)、幹事対象外は飛ばす */
function nextKanji(g){
  const parts=g.participants.filter(pid=>{const p=state.players.find(x=>x.id===pid); return p && gross(g,pid)>0;});
  const order=ranked(parts,pid=>netScore(g,pid),'asc').map(r=>r.pid);
  const eligible=order.filter(pid=>{const p=state.players.find(x=>x.id===pid); return p && !p.kanjiExempt;});
  if(eligible.length<2) return null;
  const nikai=eligible[1];
  const booby=eligible[eligible.length-2];
  return {nikai, booby, sameCount:eligible.length};
}

/* ============================ RESULTS ============================ */
let resultSub='ind';   // 'pts' | 'ind' | 'prize' | 'team'
function setResultSub(s){ resultSub=s; renderResult(); }
// 開封済みホール(revealHoles)までのスコアだけ集計に使うビュー用ゲーム（18=全開）
function viewGame(g){
  if(revealHoles>=18) return g;
  const scores={};
  g.participants.forEach(pid=>{ const a=g.scores[pid]||[]; scores[pid]=a.map((v,i)=> i<revealHoles? v : null); });
  return Object.assign({}, g, {scores});
}
function openNextHole(){ revealHoles=Math.min(18,revealHoles+1); renderResult(); }
function closeHole(){ revealHoles=Math.max(0,revealHoles-1); renderResult(); }
function openAllHoles(){ revealHoles=18; renderResult(); }
function resetHoles(){ revealHoles=0; renderResult(); }

function renderResult(){
  const el=document.getElementById('view-result'); const g0=curGame();
  if(!g0){ el.innerHTML='<div class="empty">ゲーム未選択</div>'; return; }
  const parts=g0.participants.filter(pid=>state.players.find(x=>x.id===pid));
  if(!parts.length){ el.innerHTML='<div class="empty">参加者がいません</div>'; return; }
  const g=viewGame(g0);   // 開封済みホールのみ反映
  const partial = revealHoles<18 ? `<span class="tag" style="background:#d4ac0d;color:#fff">${revealHoles}/18H</span>` : '';
  let sticky=`<div class="result-sticky"><div class="subtab4">
      <button class="${resultSub==='pts'?'on':''}" onclick="setResultSub('pts')">🪙 配分</button>
      <button class="${resultSub==='ind'?'on':''}" onclick="setResultSub('ind')">👤 個人戦</button>
      <button class="${resultSub==='prize'?'on':''}" onclick="setResultSub('prize')">🎯 ニアドラ</button>
      <button class="${resultSub==='team'?'on':''}" onclick="setResultSub('team')">🚩 チーム戦</button>
    </div></div>`;
  let body;
  if(resultSub==='pts') body=renderStanding(g, parts);
  else if(resultSub==='ind') body=renderIndividual(g, parts);
  else if(resultSub==='prize') body=renderPrizeTab(g);
  else body=renderTeamTab(g);
  el.innerHTML = sticky + body;
}

// 🪙 配分タブ
function renderStanding(g, parts){
  const {pts,payout,total,pool}=computePayout(g);
  const prows=parts.map(pid=>({pid,pt:pts[pid]||0,yen:payout[pid]||0})).sort((a,b)=>b.pt-a.pt);
  return `<div class="card payoutcard"><h2>🪙 賞金ポイント配分 ${statusBadge(g)}</h2>
    <div class="muted">獲得ポイント合計 ${total}pt${pool?` / 賞金総額 ¥${pool.toLocaleString()} をポイント比で配分`:'（賞金総額は「ゲーム」タブで入力すると配分額が出ます）'}。${revealHoles<18?`<b>個人戦タブで${revealHoles}/18H開封中</b>＝開封したホール分だけ加算されます。`:'スコアや個人賞を入れるたびに自動更新。'}</div>
    <table class="lb" style="margin-top:6px"><tr><th>順</th><th>選手</th><th>ポイント</th>${pool?'<th>配分額</th>':''}</tr>
    ${prows.map((r,i)=>{const p=state.players.find(x=>x.id===r.pid);
      return `<tr class="rank ${i===0&&r.pt>0?'rank1':''}"><td>${r.pt>0?(i+1):'-'}</td><td style="text-align:left">${esc(p.name)}</td><td><b>${r.pt}</b>pt</td>${pool?`<td><b>¥${r.yen.toLocaleString()}</b></td>`:''}</tr>`}).join('')}
    </table></div>`;
}

// 👤 個人戦タブ（左：1ホールずつ開けるスコア表 / 右：各順位が入れ替わる）
function renderIndividual(g, parts){
  const F=g.formats;
  const done=parts.filter(pid=>complete(g,pid)).length;
  const banner = allComplete(g)
    ? `<div class="card" style="background:#eafaf1;border-color:var(--green2)"><b>🏁 順位確定</b> — 全${parts.length}名の18Hが出そろいました。以下が最終順位です。</div>`
    : `<div class="card" style="background:#fef9e7;border-color:var(--gold)"><b>⏳ 暫定順位</b> — ${done}/${parts.length}名が18H入力済み${revealHoles<18?`・${revealHoles}/18H開封中`:''}。左のスコア表を1ホールずつ開けると右の順位が入れ替わります。</div>`;
  // 次回幹事（ネットで決定）→ ネット順位でハイライト
  const nk=nextKanji(g); const hl={}; if(nk){ hl[nk.nikai]='🎌2位'; hl[nk.booby]='🎌ブービー'; }
  const kanjiCard = nk
    ? `<div class="card kanjicard tight"><h2>🎌 次回幹事（ネット2位＋ブービー）</h2>
        <div class="row" style="gap:18px"><div><div class="muted">2位</div><div class="big">${esc(state.players.find(x=>x.id===nk.nikai)?.name||'')}</div></div>
        <div><div class="muted">ブービー</div><div class="big">${esc(state.players.find(x=>x.id===nk.booby)?.name||'')}</div></div></div>
        <div class="muted" style="margin-top:6px">ネット順位で決定（幹事対象外は繰り下げ）。上のネット順位で🎌ハイライト。</div></div>`
    : `<div class="card kanjicard tight"><h2>🎌 次回幹事</h2><div class="muted">スコアが入り幹事対象が2名以上になると表示されます。</div></div>`;

  // 右：順位群
  let right='';
  right+=scoreSummaryCard(g,parts);
  if(F.net) right+=leaderboard('🥇 ネット順位', parts, pid=>netScore(g,pid), 'asc', v=>v, '', 'net', hl);
  right+=kanjiCard;
  if(F.gross) right+=leaderboard(g.womenEvery.enabled?'🏅 グロス順位（女性エブリ反映）':'🏅 グロス順位', parts, pid=>effGross(g,pid), 'asc', v=>v, '', 'gross');
  if(F.stableford) right+=leaderboard('🎯 ステーブルフォード順位', parts, pid=>stablefordPts(g,pid), 'desc', v=>v+'pt', '', 'stb');
  if(F.olympic) right+=leaderboard('🏆 オリンピック順位', parts, pid=>olympicPts(g,pid), 'desc', v=>v+'pt', '', 'oly');
  if(F.callaway){ const cdone=parts.filter(pid=>complete(g,pid));
    right+= cdone.length? leaderboard('📐 キャロウェイ順位', cdone, pid=>callawayNet(g,pid),'asc',v=>v,'18H完了者のみ','cal')
      : `<div class="card tight"><h2>📐 キャロウェイ</h2><div class="muted">18H完了者がいません</div></div>`; }
  if(F.nassau) right+=leaderboard('🤝 握り順位（トータル・ネット）', parts, pid=>nassauTotalNet(g,pid),'asc',v=>v,'前半/後半/トータルの3勝負のうちトータル','nas');

  const left = holeRevealGrid(g,parts);
  return banner + `<div class="ind-split"><div class="ind-left">${left}</div><div class="ind-right">${right}</div></div>
    <details style="margin-top:10px"><summary>📖 各ゲームのルール解説</summary><div class="in">
      <div class="rule"><b>ネット</b>：ダブルペリアのハンデ後スコア。総合優勝はこれで決めるのが定番。少ないほど上位。</div>
      <div class="rule"><b>グロス</b>：ハンデ前の素の打数（女性エブリのみ反映）。少ないほど上位。</div>
      <div class="rule"><b>ステーブルフォード</b>：Wボギー以上0/ボギー1/パー2/バーディ3/イーグル4/アルバ5。合計点が高いほど上位。大叩きに強い。</div>
      <div class="rule"><b>オリンピック</b>：パー1/バーディ4/イーグル6/アルバ10の陣取り。高いほど上位。</div>
      <div class="rule"><b>キャロウェイ</b>：当日グロスからハンデ自動算出（悪いホールを控除・17,18番除外）。少ないほど上位。18H完了者のみ。</div>
      <div class="rule"><b>握り/ナッソー</b>：前半9H・後半9H・18Hトータルの3勝負。ここはトータルのネット順位。</div>
    </div></details>`;
}

// 左パネル：1ホールずつ開封するスコア表（開封済みホールだけ列表示）
function holeRevealGrid(g, parts){
  const n=revealHoles; const cols=Array.from({length:n},(_,i)=>i);
  const runTot=pid=>{ let t=0; for(let i=0;i<n;i++){const v=(g.scores[pid]||[])[i]; if(v)t+=Number(v);} return t||''; };
  const parTot=()=>{ let t=0; for(let i=0;i<n;i++)t+=g.par[i]; return t; };
  return `<div class="card"><h2>🎬 スコア表（ホール開封）<span class="tag" style="background:#d4ac0d;color:#fff">${n}/18H</span></h2>
    <div class="reveal-bar">
      <button class="btn gold sm" onclick="openNextHole()" ${n>=18?'disabled':''}>▶ 次のホール</button>
      <button class="btn gray sm" onclick="closeHole()" ${n<=0?'disabled':''}>◀</button>
      <button class="btn gray sm" onclick="openAllHoles()">全部</button>
      <button class="btn gray sm" onclick="resetHoles()">最初から</button>
    </div>
    <div class="scroll" style="margin-top:8px"><table class="scoregrid">
      <tr><th class="name">選手</th>${cols.map(i=>`<th class="${g.hidden[i]?'hidden-h':''}">${i+1}</th>`).join('')}<th class="sum">計</th></tr>
      <tr><td class="name" style="font-size:11px;color:var(--sub)">Par</td>${cols.map(i=>`<td class="${g.hidden[i]?'hidden-h':''}" style="font-size:11px;color:var(--sub)">${g.par[i]}</td>`).join('')}<td class="sum">${parTot()||''}</td></tr>
      ${parts.map(pid=>{ const p=state.players.find(x=>x.id===pid); const sc=g.scores[pid]||[];
        return `<tr><td class="name">${p.gender==='F'?'🌸':''}${esc(p.name)}</td>
          ${cols.map(i=>`<td class="${g.hidden[i]?'hidden-h':''}">${sc[i]??''}</td>`).join('')}<td class="sum">${runTot(pid)}</td></tr>`; }).join('')}
    </table></div>
    ${n===0?'<div class="muted" style="margin-top:6px">▶「次のホール」を押すと1ホールずつ開き、右の順位が入れ替わります。</div>':''}
  </div>`;
}

// スコア一覧（Gross/HDCP/Net サマリ）
function scoreSummaryCard(g, parts){
  return `<div class="card tight"><h2>📊 スコア一覧</h2><div class="scroll"><table class="lb">
    <tr><th>選手</th><th>Gross</th>${g.womenEvery.enabled?'<th>エブリ</th>':''}<th>HDCP</th><th>Net</th></tr>
    ${parts.map(pid=>{ const p=state.players.find(x=>x.id===pid);
      return `<tr class="rank"><td style="text-align:left">${p.gender==='F'?'🌸':''}${esc(p.name)}</td>
        <td>${gross(g,pid)||'-'}</td>${g.womenEvery.enabled?`<td>${womenEvery(g,pid)?'−'+womenEvery(g,pid):'-'}</td>`:''}
        <td>${periaHdcp(g,pid)}</td><td><b>${netScore(g,pid)}</b></td></tr>`; }).join('')}

}

// 🎯 ニアピン/ドラコン タブ
function renderPrizeTab(g){
  const P=g.prizes;

}

// 🚩 チーム戦タブ
function renderTeamTab(g){
  const F=g.formats;
  const anyTeamFmt = F.teamGross||F.teamNet||F.holeByHole||F.best2ball;
  if(!g.teams.filter(t=>t.memberIds.length).length)

// リーダーボード（1行=1選手。ホール開封で値が埋まり順位が入れ替わる。hlMap=強調する選手）
function leaderboard(title, pids, valFn, dir, fmt, note, key, hlMap){
  const rows=ranked(pids,valFn,dir);
  const medalOf=r=> r.rank===1?'🥇':r.rank===2?'🥈':r.rank===3?'🥉':r.rank;
  const nameOf=pid=>{const p=state.players.find(x=>x.id===pid);return (p&&p.gender==='F'?'🌸':'')+esc(p&&p.name);};
  const body=`<table class="lb"><tr><th>順</th><th>選手</th><th>${dir==='asc'?'スコア':'得点'}</th></tr>
    ${rows.map(r=>{ const hb=hlMap&&hlMap[r.pid];
      return `<tr class="rank ${r.rank===1?'rank1':''} ${hb?'hlrow':''}"><td class="medal">${medalOf(r)}</td><td style="text-align:left">${nameOf(r.pid)}${hb?`<span class="kanjibadge">${hb}</span>`:''}</td><td><b>${fmt(r.v)}</b></td></tr>`; }).join('')}</table>`;
  return `<div class="card tight"><h2>${title}</h2>${note?`<div class="muted" style="margin-bottom:6px">${note}</div>`:''}${body}</div>`;
}

function renderPrizes(g){
  const P=g.prizes; if(!P.niapinHoles.length && !P.draconHoles.length) return '';
  const parts=g.participants.filter(pid=>state.players.find(x=>x.id===pid));
  const opts=(sel)=>`<option value="">—</option>${parts.map(pid=>{const p=state.players.find(x=>x.id===pid);
    return `<option value="${pid}" ${sel===pid?'selected':''}>${p.gender==='F'?'🌸':''}${esc(p.name)}</option>`}).join('')}`;
  const np2=parts.filter(pid=>state.players.find(x=>x.id===pid)?.niapin2nd).map(pid=>esc(state.players.find(x=>x.id===pid).name));
  const dc2=parts.filter(pid=>state.players.find(x=>x.id===pid)?.dracon2nd).map(pid=>esc(state.players.find(x=>x.id===pid).name));
  let html=`<div class="card prizewin"><h2>🎯 個人賞（ニアピン / ドラコン）</h2>
    <div class="muted">勝者を選択して記録。2打目計測OKは選手マスターのチェックで設定します。</div>`;
  if(P.niapinHoles.length){ html+=`<h3>📍 ニアピン</h3>${np2.length?`<div class="muted">2打目OK（ニアピン）: ${np2.join('、')}</div>`:''}`;
    P.niapinHoles.slice().sort((a,b)=>a-b).forEach(h=>{ html+=`<div class="row between" style="margin:4px 0">
      <span class="pill e1">${h+1}H</span>
      <select style="flex:1;max-width:60%" onchange="setPrize('niapinWinner',${h},this.value)">${opts(P.niapinWinner[h])}</select></div>`; }); }
  if(P.draconHoles.length){ html+=`<h3>💪 ドラコン</h3>${dc2.length?`<div class="muted">2打目OK（ドラコン）: ${dc2.join('、')}</div>`:''}`;
    P.draconHoles.slice().sort((a,b)=>a-b).forEach(h=>{ html+=`<div class="row between" style="margin:4px 0">
      <span class="pill f" style="background:#fadbd8;color:#c0392b">${h+1}H</span>
      <select style="flex:1;max-width:60%" onchange="setPrize('draconWinner',${h},this.value)">${opts(P.draconWinner[h])}</select></div>`; }); }
  html+=`</div>`; return html;
}
function setPrize(k,h,v){ curGame().prizes[k][h]=v; save(); renderResult(); }

function renderTeams(g){
  const F=g.formats; const teams=g.teams.filter(t=>t.memberIds.length);
  let html=`<div class="card"><h2>🚩 チーム対抗戦</h2>`;
  const teamGross=t=>t.memberIds.reduce((a,pid)=>a+effGross(g,pid),0);
  const teamNet=t=>Math.round(t.memberIds.reduce((a,pid)=>a+netScore(g,pid),0)*10)/10;
  const tbl=(title,valFn,note)=>{ const rows=teams.map(t=>({t,v:valFn(t)})).sort((a,b)=>a.v-b.v);
    return `<h3>${title}</h3>${note?`<div class="muted">${note}</div>`:''}<table class="lb"><tr><th>順</th><th>チーム</th><th>合計</th></tr>
      ${rows.map((r,i)=>`<tr class="rank ${i===0?'rank1':''}"><td>${i===0?'🥇':i+1}</td><td style="text-align:left">${esc(r.t.name)} <span class="tag">${r.t.memberIds.length}名</span></td><td><b>${Math.round(r.v*10)/10}</b></td></tr>`).join('')}</table>`; };
  if(F.teamGross) html+=tbl('グロス対抗（合計が少ない方が勝ち）',teamGross);
  if(F.teamNet) html+=tbl('ネット対抗（合計が少ない方が勝ち）',teamNet);
  if(F.best2ball) html+=tbl('ベスト2ボール（ネット上位2名の合計）', t=>best2(g,t),'チーム内ネット上位2名の合計で勝負');
  if(F.holeByHole && teams.length>=2){
    const {won}=holesWon(g); const max=Math.max(...won);
    const holeRes=[]; for(let h=0;h<18;h++){
      const tot=teams.map(t=>{ let s=0,cnt=0; t.memberIds.forEach(pid=>{const v=(g.scores[pid]||[])[h]; if(v){s+=Number(v);cnt++;}}); return cnt?s:null; });
      const valid=tot.filter(v=>v!=null); if(!valid.length){holeRes.push(null);continue;}
      const min=Math.min(...valid); holeRes.push({tot,winners:tot.map((v,i)=>v===min?i:-1).filter(i=>i>=0)});
    }
    html+=`<h3>⚔️ ホールバイホール対抗</h3>
      <table class="lb"><tr><th>チーム</th><th>取ったホール数</th></tr>
      ${teams.map((t,i)=>`<tr class="rank ${won[i]===max?'rank1':''}"><td style="text-align:left">${esc(t.name)}</td><td><b>${Math.round(won[i]*10)/10}</b></td></tr>`).join('')}</table>
      <details style="margin-top:8px"><summary>ホール別の勝敗を見る</summary><div class="in"><div class="scroll"><table class="scoregrid">
        <tr><th class="name">H</th>${g.par.map((_,i)=>`<th>${i+1}</th>`).join('')}</tr>
        ${teams.map((t,ti)=>`<tr><td class="name">${esc(t.name)}</td>${holeRes.map(r=>{ if(!r)return'<td>-</td>';
          const win=r.winners.includes(ti); return `<td style="${win?'background:#d5f5e3;font-weight:800;color:var(--green)':''}">${r.tot[ti]??'-'}</td>`; }).join('')}</tr>`).join('')}
      </table></div><div class="muted">緑=そのホールを取ったチーム（合計打数が最少）。</div></div></details>`;
  }
  html+=`</div>`; return html;
}

/* ============================ BACKUP ============================ */
function exportData(){ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='76club-backup.json'; a.click(); toast('書き出しました'); }
function importData(inp){ const f=inp.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{ try{ const s=JSON.parse(r.result); if(!s.players)throw 0; migrate(s); state=s; save(); render(); toast('読み込み完了'); }
    catch(e){ toast('ファイルが不正です'); } }; r.readAsText(f); }

/* ============================ INIT ============================ */
render();
</script>
